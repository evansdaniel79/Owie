<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Owie - BMS data monitor</title>
    <link rel="stylesheet" href="styles.css?v=5">
</head>

<body>
    <main class="page page-wide">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">OW</span>
                <span class="brand-name">Owie</span>
            </div>
            <span class="ap-name">%DISPLAY_AP_NAME%</span>
        </header>

        <h1>BMS Data Monitor</h1>

        <textarea readonly="1" id="term" cols="340" name="t1" wrap="off" class="terminal"></textarea>

        <div class="btn-row">
            <button id="startstop" onclick="connect();">Connect</button>
            <button class="btn-secondary" onclick="history.back()">Back</button>
        </div>

        <div class="section">
            <h2 class="section-title">Packet Stats</h2>
            %PACKET_STATS_TABLE%
        </div>

        <script>
            let packets = [];
            let lastError = '';
            let unknownData = '';
            const term = document.getElementById("term");
            const button = document.getElementById('startstop');
            let socket;

            function formatPacket(byteArray) {
                var s = '';
                byteArray.forEach((byte) => {
                    s += ('0' + byte.toString(16)).slice(-2);
                    s += ' ';
                });
                return s;
            }

            function updateTerminal() {
                let text = '';
                for (let i = 0; i < packets.length; i++) {
                    text += packets[i] || '';
                    text += '\n';
                }
                term.value = (text + unknownData + lastError);
            }

            function stop() {
                socket.close();
                socket = undefined;
            }

            function connect() {
                socket = new WebSocket(`ws://${window.location.hostname}/rawdata`);
                socket.binaryType = "arraybuffer";
                socket.onopen = function () {
                    lastError = 'connected';
                    updateTerminal();
                    button.innerText = 'Stop';
                    button.setAttribute('onclick', 'stop();');
                }
                socket.onclose = function () {
                    lastError = 'disconnected';
                    updateTerminal();
                    // Packets will get erased right after we reconnect.
                    packets = [];
                    unknownData = '';
                    button.innerText = 'Connect';
                    button.setAttribute('onclick', 'connect();');
                }
                socket.onmessage = function (event) {
                    if (!event.data instanceof ArrayBuffer) {
                        lastError = "non-binary data";
                        updateTerminal();
                        return;
                    }
                    const data = new Uint8Array(event.data);
                    if (data[0] == 0) {
                        unknownData = `Unknown data: ${formatPacket(data.slice(1))}\n`;
                        updateTerminal();
                        return;
                    }
                    if (data.length < 4) {
                        lastError = `data is too short, length = ${data.length}`;
                        updateTerminal();
                        return;
                    }
                    packets[data[3]] = formatPacket(data);
                    updateTerminal();
                };

                socket.onerror = function (error) {
                    lastError = "websocket error";
                    updateTerminal();
                };
            }
            window.setTimeout(connect, 0);
    //# sourceURL=monitor.js
        </script>
    </main>
</body>

</html>
