<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Owie - Developer Settings</title>
    <link rel="stylesheet" href="styles.css?v=5">
</head>

<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">OW</span>
                <span class="brand-name">Owie</span>
            </div>
            <span class="ap-name">%DISPLAY_AP_NAME%</span>
        </header>

        <h1>Developer Settings</h1>

        <div class="btn-row">
            <form action="/wifi">
                <button>Wifi Configuration</button>
            </form>
            <form action="/monitor">
                <button class="btn-secondary">Monitor BMS data</button>
            </form>
            <button class="btn-secondary" onclick="history.back()">Back</button>
        </div>
    </main>
</body>

</html>
