<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Owie Update - Failed</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>

<body>
  <main class="page update-page update-result">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">OW</span>
        <span class="brand-name">Owie</span>
      </div>
      <a class="topbar-link" href="/update">Back</a>
    </header>

    <div class="status-icon error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
      </svg>
    </div>
    <h1>Update failed</h1>
    <p class="page-lead">The firmware could not be flashed. Check the error and try again.</p>
    <pre class="error-box">%UPDATE_ERROR%</pre>
    <button onclick="history.back()">Try again</button>
  </main>
</body>

</html>
