name: "attach-firmware"

# Manual fallback: build the firmware from the chosen branch and attach it to an
# existing GitHub release. Run it from the Actions tab: "Run workflow", then
# type the release tag (e.g. v1.7.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the firmware to"
        required: true
        default: "v1.7.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: "Build and test all"
    uses: ./.github/workflows/build_and_test_all.yml
  attach:
    name: "Attach firmware to release"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./fw
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mv ./fw/firmware.bin "./fw/firmware_${TAG}.bin"
          gh release upload "$TAG" "./fw/firmware_${TAG}.bin" --clobber --repo "$REPO"
