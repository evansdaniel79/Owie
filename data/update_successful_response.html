<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="refresh" content="10;URL='/'" />
  <title>Owie Update - Success</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>

<body>
  <main class="page update-page update-result">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">OW</span>
        <span class="brand-name">Owie</span>
      </div>
    </header>

    <div class="status-icon success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1>Update successful</h1>
    <p class="page-lead">The board is rebooting into the new firmware. Keep it powered until WiFi comes back.</p>
    <p class="footer-note">Redirecting in <span id="countdown">10</span>s</p>
  </main>

  <script>
    var s = 10;
    var el = document.getElementById('countdown');
    setInterval(function () {
      s -= 1;
      if (el) el.textContent = Math.max(s, 0);
    }, 1000);
  </script>
</body>

</html>
