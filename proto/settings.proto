syntax = "proto3";

message BatteryStateMsg {
  int32 bottom_milliamp_seconds = 1;
  int32 current_milliamp_seconds = 2;
  int32 top_soc = 3;
  int32 bottom_soc = 4;
}

message SettingsMsg {
  uint32 quick_power_cycle_count = 1;
  string ap_name = 2;
  string ap_password = 3;
  int32 graceful_shutdown_count = 4;
  string ap_self_password = 6;
  string ap_self_name = 7;
  int32 wifi_power = 8;
  bool is_locked = 9; // if the board is actively locked/parked
  bool locking_enabled = 10; // if the board locking functionality is enabled ('armed')
  BatteryStateMsg battery_state = 12;
  // "Stock battery mode" switches. All default to false, which keeps the
  // original Owie behavior. When true, the matching BMS packet is forwarded to
  // the board untouched.
  bool pass_through_soc = 13;      // battery percentage (packet 3)
  bool pass_through_current = 14;  // current: regen percent + range (packet 5)
  bool pass_through_status = 15;   // status flags (packet 0)

  // Battery pack description (0 / unset = not configured). Used for the rated
  // capacity and battery health figures only; never changes what Owie sends to
  // the board.
  uint32 pack_cell_type = 16;     // see lib/bms/battery_pack.h
  uint32 pack_series = 17;        // cells in series (S)
  uint32 pack_parallel = 18;      // cells in parallel (P)
  uint32 pack_custom_cell_mah = 19;  // only for the custom cell type

  reserved 5,11;
}